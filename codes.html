<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Trainer Codes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f0eeff; --surface: #ffffff; --ink: #221e4b; --muted: #55527f; --line: #d9d5f3;
  --accent: #5a49d6; --on-accent: #ffffff; --accent-soft: #e6e2ff;
  --gold: #ffc53a; --gold-ink: #8a5a00;
  --font-display: 'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body: 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15132e; --surface: #201d44; --ink: #efecff; --muted: #b0add9; --line: #37336d;
    --accent: #9a8dff; --on-accent: #17143a; --accent-soft: #2c2860; --gold: #ffcd4d; --gold-ink: #ffd86e; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.page { max-width: 36rem; margin: 0 auto; padding: 1.75rem 16px 3rem; display: grid; gap: 1.25rem; }
h1 { font: 700 clamp(1.7rem,6.5vw,2.3rem)/1.1 var(--font-display); margin: 0 0 .4rem; display: flex; align-items: center; gap: .5rem; text-wrap: balance; }
h1 svg { flex: none; width: 1.1em; height: 1.1em; }
h1 svg path { fill: var(--gold); stroke: var(--gold-ink); stroke-width: 1.4; stroke-linejoin: round; }
.lede { margin: 0; color: var(--muted); }
.back { display: inline-block; margin-bottom: .8rem; color: var(--accent); font-weight: 800; text-decoration: none; }
.back:hover { text-decoration: underline; }
.back:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
li { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: .8rem 1rem; }
.name { font-weight: 800; flex: 1 1 8rem; min-width: 0; overflow-wrap: anywhere; }
.code { font: 700 1.1rem var(--font-display); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.none { color: var(--muted); font-size: .92rem; }
button { font: 700 .92rem var(--font-body); background: var(--accent); color: var(--on-accent); border: 2px solid var(--accent); border-radius: 12px; padding: .4rem .9rem; cursor: pointer; }
.err { color: #b3261e; font-weight: 700; }
@media (prefers-color-scheme: dark) { .err { color: #ff8a80; } }
</style>
</head>
<body>
<main class="page">
  <div>
    <a class="back" href="./">&larr; Back to the checker</a>
    <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.5 6.2 6.5 2.5-6.5 2.6L12 20l-2.5-6.2L3 11.2l6.5-2.5z"/></svg><span>My Trainer Codes</span></h1>
    <p class="lede">Tap Copy, then paste the code into Pokémon GO to send a friend request.</p>
  </div>
  <ul id="list" aria-live="polite"></ul>
</main>
<script>
(function () {
  var list = document.getElementById('list');
  function parse(text) {
    var out = [], cur = null;
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim();
      if (!t || t.charAt(0) === '#') return;
      var m = t.match(/^\[(.+)\]$/);
      if (m) { cur = { name: m[1].trim(), code: '' }; out.push(cur); }
      else if (cur && /^code\s*[=:]/i.test(t)) cur.code = t.replace(/^code\s*[=:]/i, '').trim();
    });
    return out;
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function copy(text, btn) {
    var digits = text.replace(/\s+/g, '');
    function done(ok) { btn.textContent = ok ? 'Copied!' : 'Select and copy'; setTimeout(function () { btn.textContent = 'Copy'; }, 1800); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(digits).then(function () { done(true); }, function () { done(false); });
    else done(false);
  }
  fetch('friends.txt', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
    var accts = parse(t);
    if (!accts.length) throw 0;
    accts.forEach(function (a) {
      var li = el('li');
      li.append(el('span', 'name', a.name));
      if (a.code) {
        li.append(el('span', 'code', a.code));
        var b = el('button', null, 'Copy'); b.type = 'button';
        b.addEventListener('click', function () { copy(a.code, b); });
        li.append(b);
      } else li.append(el('span', 'none', 'Code coming soon'));
      list.append(li);
    });
  }).catch(function () { var li = el('li'); li.append(el('span', 'err', "Couldn't load the list. Please refresh and try again.")); list.append(li); });
})();
</script>
</body>
</html>
