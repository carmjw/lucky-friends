<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Friend Checker</title>
<meta name="description" content="Are we lucky friends in Pokémon GO? Type your trainer name to find out!">
<meta name="theme-color" content="#5a49d6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2.5l2.5 6.2 6.5 2.5-6.5 2.6L12 20l-2.5-6.2L3 11.2l6.5-2.5z%27 fill=%27%23ffc53a%27 stroke=%27%238a5a00%27 stroke-width=%271.4%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --bg: #f0eeff; --surface: #ffffff; --ink: #221e4b; --muted: #55527f; --line: #d9d5f3;
  --accent: #5a49d6; --on-accent: #ffffff; --accent-soft: #e6e2ff;
  --gold: #ffc53a; --gold-ink: #8a5a00; --gold-wash: #fff1c2; --on-gold: #3a2600;
  --sheen: rgba(255,255,255,.65);
  --font-display: 'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body: 'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15132e; --surface: #201d44; --ink: #efecff; --muted: #b0add9; --line: #37336d;
    --accent: #9a8dff; --on-accent: #17143a; --accent-soft: #2c2860;
    --gold: #ffcd4d; --gold-ink: #ffd86e; --gold-wash: #3b3217; --on-gold: #3a2600;
    --sheen: rgba(255,255,255,.14); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
.page { max-width: 36rem; margin: 0 auto; padding: 1.75rem 16px 3rem; display: grid; gap: 1.25rem; }
h1 { font: 700 clamp(1.7rem,6.5vw,2.3rem)/1.1 var(--font-display); margin: 0 0 .4rem; display: flex; align-items: center; gap: .5rem; text-wrap: balance; }
h1 svg { flex: none; width: 1.1em; height: 1.1em; }
h1 svg path { fill: var(--gold); stroke: var(--gold-ink); stroke-width: 1.4; stroke-linejoin: round; }
.lede { margin: 0; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.1rem; }
label { display: block; font-weight: 800; margin-bottom: .4rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; }
input { flex: 1 1 12rem; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: .7rem .85rem; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font: 700 1rem var(--font-body); background: var(--accent); color: var(--on-accent); border: 2px solid var(--accent); border-radius: 14px; padding: .65rem 1.2rem; cursor: pointer; }
.summary { font: 600 1.25rem/1.3 var(--font-display); margin: 1.1rem 0 .2rem; text-wrap: balance; }
.sub { margin: 0 0 .8rem; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.roster { list-style: none; margin: .9rem 0 0; padding: 0; display: grid; gap: .6rem; }
.acct { display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }
.acct .name { flex: 1; min-width: 0; font-weight: 800; overflow-wrap: anywhere; }
.acct svg { flex: none; width: 28px; height: 28px; }
.acct svg path { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linejoin: round; }
.chip { flex: none; font-weight: 800; font-size: .85rem; padding: .25rem .75rem; border-radius: 999px; }
.acct.lucky { border-color: var(--gold); background: linear-gradient(120deg, var(--gold-wash), var(--surface) 80%); }
.acct.lucky svg path { fill: var(--gold); stroke: var(--gold-ink); }
.acct.lucky .chip { background: var(--gold); color: var(--on-gold); }
.acct.nope .chip { background: var(--accent-soft); color: var(--muted); }
.acct.lucky::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, var(--sheen) 50%, transparent 65%); transform: translateX(-100%); animation: shine 2.6s ease-in-out .2s 1 forwards; pointer-events: none; }
@keyframes shine { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .acct.lucky::after { display: none; } }
.linkbtn { display: inline-block; margin-top: .9rem; text-decoration: none; font: 700 1rem var(--font-body); background: var(--accent-soft); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: .6rem 1.1rem; }
.linkbtn:hover { border-color: var(--accent); }
.linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.sugg { list-style: none; margin: .7rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
.sugg[hidden] { display: none; }
.sugg button { font: 700 .92rem var(--font-body); background: var(--accent-soft); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: .3rem .8rem; cursor: pointer; overflow-wrap: anywhere; }
.sugg button:hover { border-color: var(--accent); }
.soundbtn { display: inline-block; margin-top: .7rem; padding: .2rem 0; background: none; border: none; color: var(--muted); font: 700 .9rem var(--font-body); text-decoration: underline; cursor: pointer; }
.soundbtn[hidden] { display: none; }
.foot { text-align: center; color: var(--muted); font-size: .85rem; margin: 0; }
.err { color: #b3261e; font-weight: 700; margin: .9rem 0 0; }
@media (prefers-color-scheme: dark) { .err { color: #ff8a80; } }
</style>
</head>
<body>
<main class="page">
  <div>
    <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.5 6.2 6.5 2.5-6.5 2.6L12 20l-2.5-6.2L3 11.2l6.5-2.5z"/></svg><span>Lucky Friend Checker</span></h1>
    <p class="lede">Type your trainer name to see which of my Pokémon GO accounts you're lucky friends with.</p>
    <a class="linkbtn" href="codes.html">See all my trainer codes</a>
  </div>
  <section class="card">
    <label for="trainer">Trainer name</label>
    <form class="row" id="form">
      <input id="trainer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Your trainer name">
      <button type="submit">Check</button>
    </form>
    <ul class="sugg" id="sugg" aria-label="Name suggestions" hidden></ul>
    <button type="button" class="soundbtn" id="soundbtn" aria-pressed="true" hidden>Sound on</button>
    <div id="results" aria-live="polite"></div>
  </section>
  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  var SPARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.5 6.2 6.5 2.5-6.5 2.6L12 20l-2.5-6.2L3 11.2l6.5-2.5z"/></svg>';
  var accounts = [], loaded = false, pastList = [], settings = { sound: 'chime' };
  var box = document.getElementById('results');

  function norm(s) { return String(s || '').normalize('NFKC').toLowerCase().replace(/^@+/, '').replace(/\s+/g, ' ').trim(); }

  function parse(text) {
    var out = [], cur = null; pastList = [];
    text.split(/\r?\n/).forEach(function (line) {
      var t = line.trim();
      if (!t || t.charAt(0) === '#') return;
      var m = t.match(/^\[(.+)\]$/);
      if (m) { cur = { name: m[1].trim(), friends: [], code: '' }; if (/^(past|former)$/i.test(cur.name)) pastList = cur.friends; else out.push(cur); }
      else if (!cur && /^sound\s*[=:]/i.test(t)) settings.sound = t.replace(/^sound\s*[=:]/i, '').trim().toLowerCase();
      else if (cur && /^code\s*[=:]/i.test(t)) cur.code = t.replace(/^code\s*[=:]/i, '').trim();
      else if (cur) cur.friends.push(t);
    });
    return out;
  }


  var SOUNDS = {"chime":[[1046.5,0,0.9,"sine",0.35],[1318.5,0.12,0.9,"sine",0.35],[1568,0.24,0.9,"sine",0.35],[2093,0.36,1.3,"sine",0.35]],"sparkle":[[2093,0,0.28,"triangle",0.22],[2637,0.07,0.28,"triangle",0.22],[3136,0.14,0.28,"triangle",0.22],[2349,0.21,0.28,"triangle",0.22],[3520,0.28,0.28,"triangle",0.22],[2793,0.35,0.28,"triangle",0.22],[4186,0.42,0.6,"triangle",0.22]],"pop":[[784,0,0.14,"triangle",0.4],[1175,0.09,0.28,"triangle",0.4]],"fanfare":[[523,0,0.15,"triangle",0.3],[523,0.17,0.15,"triangle",0.3],[523,0.34,0.15,"triangle",0.3],[659,0.51,0.2,"triangle",0.3],[784,0.7,0.9,"triangle",0.3],[1046,0.7,0.9,"triangle",0.2]],"harp":[[523,0,1.3,"sine",0.3],[659,0.1,1.3,"sine",0.3],[784,0.2,1.3,"sine",0.3],[1046,0.3,1.3,"sine",0.3],[1318,0.4,1.3,"sine",0.3],[1568,0.5,1.6,"sine",0.3]]};
  var audioCtx = null, muted = false;
  try { muted = localStorage.getItem('lfc-mute') === '1'; } catch (e) {}
  function playNotes(notes) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var t0 = audioCtx.currentTime + 0.02;
      notes.forEach(function (n) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + n[1];
        o.type = n[3]; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(n[4], t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n[2]);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + n[2] + 0.05);
      });
    } catch (e) {}
  }
  function playSound() {
    var name = settings.sound || 'chime';
    if (muted || name === 'off' || name === 'none') return;
    if (SOUNDS[name]) { playNotes(SOUNDS[name]); return; }
    if (/^[\w. \-]+\.(mp3|wav|ogg|m4a)$/i.test(name)) {
      try { var a = new Audio(encodeURI(name)); a.volume = 0.8; var pr = a.play(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {}
      return;
    }
    playNotes(SOUNDS.chime);
  }
  function initSoundBtn() {
    var btn = document.getElementById('soundbtn');
    var off = settings.sound === 'off' || settings.sound === 'none';
    btn.hidden = off;
    function label() { btn.textContent = muted ? 'Sound off' : 'Sound on'; btn.setAttribute('aria-pressed', muted ? 'false' : 'true'); }
    label();
    btn.addEventListener('click', function () {
      muted = !muted; label();
      try { localStorage.setItem('lfc-mute', muted ? '1' : '0'); } catch (e) {}
    });
  }

  function confetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var old = document.querySelector('.confetti'); if (old) old.remove();
    var c = document.createElement('canvas'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
    document.body.append(c);
    var dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    c.width = W * dpr; c.height = H * dpr;
    var ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
    var colors = ['#ffc53a', '#ff7eb6', '#9a8dff', '#5a49d6', '#6fe0c0', '#ffffff'];
    var ps = [];
    for (var i = 0; i < 140; i++) {
      var left = i % 2 === 0;
      ps.push({
        x: left ? W * 0.1 : W * 0.9, y: H * 0.35,
        vx: (left ? 1 : -1) * (2 + Math.random() * 7), vy: -(5 + Math.random() * 9),
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4,
        c: colors[(Math.random() * colors.length) | 0], star: Math.random() < 0.25
      });
    }
    var start = performance.now(), DUR = 3200;
    function frame(now) {
      var t = now - start;
      ctx.clearRect(0, 0, W, H);
      var fade = t > DUR - 800 ? Math.max(0, (DUR - t) / 800) : 1;
      ctx.globalAlpha = fade;
      ps.forEach(function (p) {
        p.vy += 0.28; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        if (p.star) {
          ctx.beginPath();
          for (var k = 0; k < 5; k++) {
            var a = k * 1.2566 - 1.5708, a2 = a + 0.6283;
            ctx.lineTo(Math.cos(a) * p.w, Math.sin(a) * p.w);
            ctx.lineTo(Math.cos(a2) * p.w * 0.45, Math.sin(a2) * p.w * 0.45);
          }
          ctx.closePath(); ctx.fill();
        } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (t < DUR) requestAnimationFrame(frame); else c.remove();
    }
    requestAnimationFrame(frame);
  }

  function show(queried, typed, celebrate) {
    box.textContent = '';
    function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    if (!loaded) { box.append(el('p', 'err', "Couldn't load the list. Please refresh and try again.")); return; }
    var hits = queried ? accounts.map(function (a) { return a.friends.some(function (f) { return norm(f) === queried; }); }) : null;
    if (hits) {
      var n = hits.filter(Boolean).length, total = accounts.length, msg;
      if (n === 0) msg = 'No lucky friends yet. Send me gifts!';
      else if (n === total) msg = "You're lucky friends with all " + total + ' of my accounts!';
      else msg = "You're lucky friends with " + n + ' of ' + total + ' accounts!';
      box.append(el('p', 'summary', msg));
      box.append(el('p', 'sub', 'Checked "' + typed + '". Spelling matters, so double check it if something looks off.'));
    }
    var ul = el('ul', 'roster');
    accounts.forEach(function (a, i) {
      var li = el('li', 'acct ' + (hits ? (hits[i] ? 'lucky' : 'nope') : ''));
      var ic = el('span'); ic.style.display = 'grid'; ic.innerHTML = SPARK;
      li.append(ic, el('span', 'name', a.name));
      if (hits) li.append(el('span', 'chip', hits[i] ? 'Lucky friends' : 'Not lucky yet'));
      ul.append(li);
    });
    box.append(ul);
    if (celebrate && hits && hits.some(Boolean)) { confetti(); playSound(); }
  }

  var sugg = document.getElementById('sugg'), inp = document.getElementById('trainer');
  function allNames() {
    var seen = {}, out = [];
    function add(f) { var k = norm(f); if (!seen[k]) { seen[k] = 1; out.push(f); } }
    accounts.forEach(function (a) { a.friends.forEach(add); });
    pastList.forEach(add);
    return out;
  }
  inp.addEventListener('input', function () {
    var q = norm(inp.value);
    sugg.textContent = '';
    if (!loaded || q.length < 2) { sugg.hidden = true; return; }
    var starts = [], has = [];
    allNames().forEach(function (n) { var k = norm(n); if (k.indexOf(q) === 0) starts.push(n); else if (k.indexOf(q) > 0) has.push(n); });
    var picks = starts.sort().concat(has.sort()).slice(0, 5);
    picks.forEach(function (n) {
      var li = document.createElement('li'), b = document.createElement('button');
      b.type = 'button'; b.textContent = n;
      b.addEventListener('click', function () { inp.value = n; sugg.hidden = true; show(norm(n), n, true); });
      li.append(b); sugg.append(li);
    });
    sugg.hidden = picks.length === 0;
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    sugg.hidden = true;
    var typed = document.getElementById('trainer').value.trim();
    if (!typed) { box.textContent = ''; var p = document.createElement('p'); p.className = 'summary'; p.textContent = 'Enter your trainer name first.'; box.append(p); return; }
    show(norm(typed), typed, true);
  });

  fetch('friends.txt', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('bad status');
    var lm = r.headers.get('last-modified');
    return r.text().then(function (t) { return { t: t, lm: lm }; });
  }).then(function (res) {
    accounts = parse(res.t); loaded = accounts.length > 0; initSoundBtn();
    if (res.lm) { var d = new Date(res.lm); if (!isNaN(d)) document.getElementById('foot').textContent = 'List updated ' + d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + '.'; }
    show('', '');
  }).catch(function () { loaded = false; show('', ''); });
})();
</script>
</body>
</html>
